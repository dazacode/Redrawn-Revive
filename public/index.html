<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos · Redrawn</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/img/logo.png">
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="shell-header"></div>
  <main class="page">
    <div class="page-head">
      <h1>Your videos <span class="count tnum" id="count"></span></h1>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Search videos" aria-label="Search videos" autocomplete="off">
      </div>
      <select class="select" id="sort" aria-label="Sort videos">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="title">Title A to Z</option>
        <option value="longest">Longest first</option>
      </select>
    </div>
    <div id="content" aria-live="polite"></div>
  </main>
  <script type="module" src="/js/pages/dashboard.js"></script>
</body>
</html>
